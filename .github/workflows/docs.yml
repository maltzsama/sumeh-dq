      - name: Inject navbar into scaladoc pages
        run: |
          python3 - <<'PY'
          import glob
          import re
          from pathlib import Path

          nav_css = """
          <style>
            .sumeh-nav {
              position: fixed;
              top: 0;
              left: 0;
              right: 0;
              height: 3.5rem;
              z-index: 104;
              display: flex;
              align-items: center;
              justify-content: space-between;
              padding: 0 1.5rem;
              background: #1f2937;
              color: white;
              font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            }
            .sumeh-nav .brand {
              display: flex;
              align-items: center;
              gap: 8px;
              color: white;
              text-decoration: none;
              font-weight: 700;
              font-size: 1.05rem;
            }
            .sumeh-nav .brand img.logo { width: 28px; height: 28px; }
            .sumeh-nav .nav-links { display: flex; gap: 1.25rem; align-items: center; }
            .sumeh-nav .nav-links a {
              color: #d1d5db;
              text-decoration: none;
              font-size: 0.9rem;
              font-weight: 500;
              transition: color 0.15s;
            }
            .sumeh-nav .nav-links a:hover { color: white; }
            .sumeh-nav .nav-links a.active { color: white; font-weight: 600; }
            #search { top: 3.5rem; }
            #content-container > div#content { margin-top: calc(3.5rem + 4em) !important; }
            #library { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
            #search > span#doc-title {
              display: inline-flex;
              align-items: baseline;
              gap: 0.5ex;
            }
            #search > span#doc-title > span#doc-version {
              display: inline;
              width: auto;
              overflow: visible;
              white-space: nowrap;
              text-overflow: clip;
              color: #c2c2c2;
              font-weight: 300;
              font-size: 0.72em;
            }
          </style>
          """

          def nav_html(prefix, active):
              links = ''
              for name, label in [('index.html', 'Home'), ('core/index.html', 'core'), ('spark/index.html', 'spark'), ('flink/index.html', 'flink'), ('changelog.html', 'Changelog')]:
                  cls = ' class="active"' if name == active else ''
                  links += f'<a href="{prefix}{name}"{cls}>{label}</a>\n                '
              return (
                  f'<nav class="sumeh-nav">\n'
                  f'  <a href="{prefix}index.html" class="brand"><img class="logo" src="{prefix}logo.svg" alt="Sumeh DQ"> Sumeh DQ</a>\n'
                  f'  <div class="nav-links">\n                {links}</div>\n'
                  f'</nav>\n'
              )

          for page in glob.glob('site/*/**/*.html', recursive=True):
              if not re.match(r'site/(core|spark|flink)/', page):
                  continue
              path = Path(page)
              text = path.read_text(encoding='utf-8')
              if 'sumeh-nav' in text:
                  continue
              m = re.search(r"var toRoot = '(.*?)';", text)
              prefix = (m.group(1) if m else '') + '../'
              module = page.split('/')[1]
              active = module + '/index.html'
              nav = nav_html(prefix, active)
              text = text.replace('<body>', '<body>\n' + nav_css + nav, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
