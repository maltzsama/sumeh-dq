name: docs

on:
  push:
    branches: [main]
    paths:
      - "**/*.scala"
      - "**/*.sbt"
      - "project/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: sbt/setup-sbt@v1

      - name: Generate scaladoc
        run: sbt -batch "core/Compile/doc" "spark/Compile/doc" "flink/Compile/doc"

      - name: Stage API reference
        run: |
          mkdir -p site/core site/spark site/flink
          cp -r core/target/scala-2.13/api/. site/core/
          cp -r spark/target/scala-2.13/api/. site/spark/
          cp -r flink/target/scala-2.13/api/. site/flink/
          cp docs/img/sumeh.svg site/logo.svg
          cat > site/index.html <<'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sumeh DQ — API Reference</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           max-width: 680px; margin: 48px auto; padding: 0 24px; color: #1f2933; }
    img.logo { width: 48px; vertical-align: middle; margin-right: 12px; }
    h1 { display: flex; align-items: center; }
    a { color: #0066cc; text-decoration: none; }
    a:hover { text-decoration: underline; }
    ul { line-height: 1.8; }
  </style>
</head>
<body>
  <h1><img class="logo" src="logo.svg" alt="Sumeh DQ"> Sumeh DQ API</h1>
  <p>One rule engine, two execution backends. Declarative data-quality validation for Apache Spark and Apache Flink.</p>
  <ul>
    <li><a href="core/index.html">core — rule model, registry, loaders, validation model</a></li>
    <li><a href="spark/index.html">spark — SparkValidator, analyzers, constraints, schema validator, profiler</a></li>
    <li><a href="flink/index.html">flink — FlinkValidator, rule loader, DQ process function</a></li>
  </ul>
  <p><a href="https://github.com/maltzsama/sumeh-dq">GitHub</a></p>
</body>
</html>
EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
