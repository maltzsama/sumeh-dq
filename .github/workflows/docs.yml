                padding: 0.85rem 1.5rem;
                background: #1f2937;
                color: white;
                position: sticky;
                top: 0;
                z-index: 100;
              }
              .nav .brand {
                display: flex;
                align-items: center;
                gap: 8px;
                color: white;
                text-decoration: none;
