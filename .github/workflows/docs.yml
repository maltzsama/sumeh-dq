                font-size: 1.05rem;
              }
              .nav .brand img.logo { width: 28px; height: 28px; }
              .nav-links { display: flex; gap: 1.25rem; align-items: center; }
              .nav-links a {
                color: #d1d5db;
                text-decoration: none;
                font-size: 0.9rem;
                font-weight: 500;
                transition: color 0.15s;
              }
              .nav-links a:hover { color: white; }
              .nav-links a.active { color: white; font-weight: 600; }
              .container { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }
              .readme {
                background: white;
                border: 1px solid #e5e7eb;
                border-radius: 12px;
                padding: 1.5rem 2rem;
              }
              .readme h1, .readme h2, .readme h3 { color: #111827; line-height: 1.3; margin: 1.5rem 0 0.75rem; }
              .readme h1 { font-size: 1.6rem; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.5rem; }
              .readme h2 { font-size: 1.3rem; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.4rem; }
