name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ created ]

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - run: sbt scalafmtCheckAll scalafmtSbtCheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core — both Scala versions
          - module: core
            scala: '2.12.18'
            opts: ''
          - module: core
            scala: '2.13.16'
            opts: ''

          # Spark — default version from build.sbt
          - module: spark
            scala: '2.13.16'
            opts: ''

          # Spark — 3.x line under Scala 2.12
          - module: spark
            scala: '2.12.18'
            opts: '-Dspark.version=3.5.5'

          # Spark — 3.x line under Scala 2.13
          - module: spark
            scala: '2.13.16'
            opts: '-Dspark.version=3.5.5'

          # Flink — default version from build.sbt
          - module: flink
            scala: '2.13.16'
            opts: ''

          # Flink — 2.x line under Scala 2.12
          - module: flink
            scala: '2.12.18'
            opts: ''

          # Flink — 1.x line (older Kryo; runs via the --add-opens forked tests)
          - module: flink
            scala: '2.13.16'
            opts: '-Dflink.version=1.20.0'

          # Flink — 1.x line under Scala 2.12
          - module: flink
            scala: '2.12.18'
            opts: '-Dflink.version=1.20.0'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Compile ${{ matrix.module }} (Scala ${{ matrix.scala }})
        run: sbt ${{ matrix.opts }} ++${{ matrix.scala }} ${{ matrix.module }}/compile

      - name: Test ${{ matrix.module }} (Scala ${{ matrix.scala }})
        run: sbt ${{ matrix.opts }} ++${{ matrix.scala }} ${{ matrix.module }}/test

  coverage:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Coverage (all modules) + aggregate report
        run: sbt "coverage" "test" "coverageAggregate" "coverageReport"

      - name: Locate aggregate coverage report
        id: report
        run: |
          REPORT=$(find target -name "cobertura.xml" | head -1)
          if [ -z "$REPORT" ]; then
            echo "No aggregate coverage report found"
            exit 1
          fi
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.report.outputs.report }}
          flags: unittests

  publish:
    needs: [test, coverage]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'created'
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_PACKAGES: "1"
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Core — both Scala versions
          sbt -Dversion="$VERSION" ++2.12.18 core/publish
          sbt -Dversion="$VERSION" ++2.13.16 core/publish
          # Spark 3.x line (sumeh-spark3) — both Scala versions
          sbt -Dversion="$VERSION" -Dspark.version=3.5.5 ++2.12.18 spark/publish
          sbt -Dversion="$VERSION" -Dspark.version=3.5.5 ++2.13.16 spark/publish
          # Spark 4.x line (sumeh-spark4) — Scala 2.13 only
          sbt -Dversion="$VERSION" ++2.13.16 spark/publish
          # Flink 1.x line (sumeh-flink1) — both Scala versions
          sbt -Dversion="$VERSION" -Dflink.version=1.20.0 ++2.12.18 flink/publish
          sbt -Dversion="$VERSION" -Dflink.version=1.20.0 ++2.13.16 flink/publish
          # Flink 2.x line (sumeh-flink2) — both Scala versions
          sbt -Dversion="$VERSION" ++2.12.18 flink/publish
          sbt -Dversion="$VERSION" ++2.13.16 flink/publish

  docs-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Generate scaladoc
        run: sbt -batch "core/Compile/doc" "spark/Compile/doc" "flink/Compile/doc"

      - name: Verify output exists
        run: |
          test -d core/target/scala-2.13/api
          test -d spark/target/scala-2.13/api
          test -d flink/target/scala-2.13/api
