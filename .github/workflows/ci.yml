name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ created ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core — both Scala versions
          - module: core
            scala: '2.12.18'
          - module: core
            scala: '2.13.14'

          # Spark — default version from build.sbt
          - module: spark
            scala: '2.13.14'

          # Flink — compile only (no test infra yet)
          - module: flink
            scala: '2.13.14'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'sbt'

      - name: Compile ${{ matrix.module }} (Scala ${{ matrix.scala }})
        run: sbt ++${{ matrix.scala }} ${{ matrix.module }}/compile

      - name: Test ${{ matrix.module }} (Scala ${{ matrix.scala }})
        if: matrix.module != 'flink'
        run: sbt ++${{ matrix.scala }} ${{ matrix.module }}/test

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'created'
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'sbt'

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          sbt -Dversion="$VERSION" ++2.12.18 core/publish
          sbt -Dversion="$VERSION" ++2.13.14 core/publish spark/publish flink/publish
