name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ created ]

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - run: sbt scalafmtCheckAll scalafmtSbtCheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core — both Scala versions
          - module: core
            scala: '2.12.18'
            opts: ''
          - module: core
            scala: '2.13.16'
            opts: ''

          # Spark 3.5.0 (floor) — both Scala versions
          - module: spark
            scala: '2.12.18'
            opts: '-Dspark.version=3.5.0'
          - module: spark
            scala: '2.13.16'
            opts: '-Dspark.version=3.5.0'

          # Spark 4.x — Scala 2.13 only
          - module: spark
            scala: '2.13.16'
            opts: '-Dspark.version=4.0.0'
          - module: spark
            scala: '2.13.16'
            opts: '-Dspark.version=4.1.0'
          - module: spark
            scala: '2.13.16'
            opts: '-Dspark.version=4.2.0'

          # Flink 1.20.0 (floor) — both Scala versions
          - module: flink
            scala: '2.12.18'
            opts: '-Dflink.version=1.20.0'
          - module: flink
            scala: '2.13.16'
            opts: '-Dflink.version=1.20.0'

          # Flink 2.x — both Scala versions
          - module: flink
            scala: '2.12.18'
            opts: '-Dflink.version=2.0.0'
          - module: flink
            scala: '2.13.16'
            opts: '-Dflink.version=2.0.0'
          - module: flink
            scala: '2.12.18'
            opts: '-Dflink.version=2.1.0'
          - module: flink
            scala: '2.13.16'
            opts: '-Dflink.version=2.1.0'
          - module: flink
            scala: '2.12.18'
            opts: '-Dflink.version=2.2.0'
          - module: flink
            scala: '2.13.16'
            opts: '-Dflink.version=2.2.0'
          - module: flink
            scala: '2.12.18'
            opts: '-Dflink.version=2.3.0'
          - module: flink
            scala: '2.13.16'
            opts: '-Dflink.version=2.3.0'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Compile ${{ matrix.module }} (Scala ${{ matrix.scala }})
        run: sbt ${{ matrix.opts }} ++${{ matrix.scala }} ${{ matrix.module }}/compile

      - name: Test ${{ matrix.module }} (Scala ${{ matrix.scala }})
        run: sbt ${{ matrix.opts }} ++${{ matrix.scala }} ${{ matrix.module }}/test

  coverage:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Coverage (all modules) + aggregate report
        run: sbt "coverage" "test" "coverageAggregate" "coverageReport"

      - name: Locate aggregate coverage report
        id: report
        run: |
          REPORT=$(find target -name "cobertura.xml" | head -1)
          if [ -z "$REPORT" ]; then
            echo "No aggregate coverage report found"
            exit 1
          fi
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.report.outputs.report }}
          flags: unittests

  publish:
    needs: [test, coverage]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'created'
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_PACKAGES: "1"
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Core — both Scala versions
          sbt -Dversion="$VERSION" ++2.12.18 core/publish
          sbt -Dversion="$VERSION" ++2.13.16 core/publish

          # Spark 3.5 (sumeh-spark-3.5) — both Scala versions
          sbt -Dversion="$VERSION" -Dspark.version=3.5.0 ++2.12.18 spark/publish
          sbt -Dversion="$VERSION" -Dspark.version=3.5.0 ++2.13.16 spark/publish

          # Spark 4.x (sumeh-spark-4.0 / 4.1 / 4.2) — Scala 2.13 only
          for v in 4.0.0 4.1.0 4.2.0; do
            sbt -Dversion="$VERSION" -Dspark.version=$v ++2.13.16 spark/publish
          done

          # Flink 1.20 / 2.0 / 2.1 / 2.2 / 2.3 (sumeh-flink-*) — both Scala versions
          for v in 1.20.0 2.0.0 2.1.0 2.2.0 2.3.0; do
            sbt -Dversion="$VERSION" -Dflink.version=$v ++2.12.18 flink/publish
            sbt -Dversion="$VERSION" -Dflink.version=$v ++2.13.16 flink/publish
          done

  publish-central:
    needs: [test, coverage]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'created'
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Import GPG key
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          echo "${{ secrets.PGP_SECRET }}" | base64 -d | gpg --batch --import

      - name: Build signed bundle + release to Central Portal
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          CENTRAL_PORTAL: "1"
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"

          # Core — both Scala versions
          sbt -Dversion="$VERSION" ++2.12.18 core/publishSigned
          sbt -Dversion="$VERSION" ++2.13.16 core/publishSigned

          # Spark 3.5 (sumeh-spark-3.5) — both Scala versions
          sbt -Dversion="$VERSION" -Dspark.version=3.5.0 ++2.12.18 spark/publishSigned
          sbt -Dversion="$VERSION" -Dspark.version=3.5.0 ++2.13.16 spark/publishSigned

          # Spark 4.x (sumeh-spark-4.0 / 4.1 / 4.2) — Scala 2.13 only
          for v in 4.0.0 4.1.0 4.2.0; do
            sbt -Dversion="$VERSION" -Dspark.version=$v ++2.13.16 spark/publishSigned
          done

          # Flink 1.20 / 2.0 / 2.1 / 2.2 / 2.3 (sumeh-flink-*) — both Scala versions
          for v in 1.20.0 2.0.0 2.1.0 2.2.0 2.3.0; do
            sbt -Dversion="$VERSION" -Dflink.version=$v ++2.12.18 flink/publishSigned
            sbt -Dversion="$VERSION" -Dflink.version=$v ++2.13.16 flink/publishSigned
          done

          # All 17 artifacts above land in the same local staging bundle
          # (native sbt Central Portal support, not the dead sbt-sonatype
          # plugin). sonaUpload ships the bundle and waits for a manual
          # "Publish" click in the Central Portal UI — switch to sonaRelease
          # once a full release has cleared validation at least once.
          sbt -Dversion="$VERSION" sonaUpload

  docs-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Generate scaladoc
        run: sbt -batch "core/Compile/doc" "spark/Compile/doc" "flink/Compile/doc"

      - name: Verify output exists
        run: |
          test -d core/target/scala-2.13/api
          test -d spark/target/scala-2.13/api
          test -d flink/target/scala-2.13/api
